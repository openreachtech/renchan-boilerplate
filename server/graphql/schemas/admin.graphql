scalar DateTime
scalar Upload

################################################################################
#### QUERY
################################################################################

type Query {
  customers: [Customer!]!
}

################################################################################
#### MUTATION
################################################################################

type Mutation {
  signIn(input: SignInInput): AuthResult!
  signUp(input: SignUpInput): AuthResult!
}

################################################################################
#### TYPES
################################################################################

type Customer {
  id: Int!
  name: String!
  inviteCode: String!
}

type AuthResult {
  accessToken: String!
}

################################################################################
#### INPUT
################################################################################

input SignUpInput {
  email: String!
  password: String!
}

input SignInInput {
  email: String!
  password: String!
}
